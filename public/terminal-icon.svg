<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="86" fill="none" stroke="#1e293b" stroke-width="8"/>
  <!-- Terminal Window Bar -->
  <rect x="48" y="48" width="416" height="416" rx="32" fill="#090d16" stroke="#1e293b" stroke-width="4"/>
  <circle cx="88" cy="88" r="12" fill="#ef4444"/>
  <circle cx="124" cy="88" r="12" fill="#eab308"/>
  <circle cx="160" cy="88" r="12" fill="#22c55e"/>
  <line x1="48" y1="124" x2="464" y2="124" stroke="#1e293b" stroke-width="4"/>
  <!-- Terminal Prompt Symbol >_ -->
  <path d="M100 180 L180 240 L100 300" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="210" y1="300" x2="280" y2="300" stroke="#22c55e" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>
</svg>
